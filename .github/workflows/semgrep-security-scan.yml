name: Semgrep SAST

on:
  workflow_dispatch:

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write 

    steps:
      # Pinned to 40-character commit SHA to prevent supply chain attacks via mutable tags
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.1.7

      - name: Semgrep SAST scan
        run: |
          pip install semgrep
          semgrep --config p/default --sarif --output semgrep.sarif . || true

      # Pinned to 40-character commit SHA to prevent supply chain attacks via mutable tags
      - name: Upload Semgrep SARIF as artifact
        if: always()
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # refs/tags/v4.4.1
        with:
          name: semgrep-results-${{ github.repository_owner }}-${{ github.event.repository.name }}
          path: semgrep.sarif