name: Semgrep SAST

on:
  workflow_dispatch:

jobs:
  semgrep-sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write 

    steps:
      # Pinned to 40-character commit SHA to prevent supply chain attacks via mutable tags
      - name: Checkout
        uses: actions/checkout@6929cce13e9b8f1118429ba5a2f08743ced41ad0 # v4.1.7

      - name: Semgrep SAST scan
        run: |
          pip install semgrep
          semgrep --config p/default --sarif --output semgrep.sarif . || true

      # Pinned to 40-character commit SHA to prevent supply chain attacks via mutable tags
      - name: Upload Semgrep SARIF as artifact
        if: always()
        uses: actions/upload-artifact@604373da63d1ed0a210f9b69bb27692d9d9f94f4 # v4.4.1
        with:
          name: semgrep-results-${{ github.repository_owner }}-${{ github.event.repository.name }}
          path: semgrep.sarif