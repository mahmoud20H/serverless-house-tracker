version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  dynamodb-init:
    image: amazon/aws-cli
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: 'DUMMYIDEXAMPLE'
      AWS_SECRET_ACCESS_KEY: 'DUMMYEXAMPLEKEY'
      AWS_REGION: 'us-east-1'
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for dynamodb-local...';
      sleep 2;
      aws dynamodb create-table \
        --endpoint-url http://dynamodb-local:8000 \
        --table-name Houses \
        --attribute-definitions AttributeName=property_id,AttributeType=S \
        --key-schema AttributeName=property_id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST || true;
      aws dynamodb create-table \
        --endpoint-url http://dynamodb-local:8000 \
        --table-name Brokers \
        --attribute-definitions AttributeName=broker_id,AttributeType=S \
        --key-schema AttributeName=broker_id,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST || true;
      echo 'DynamoDB tables created or already exist.'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: house-backend
    ports:
      - "3000:3000"
    depends_on:
      dynamodb-init:
        condition: service_started
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: house-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend